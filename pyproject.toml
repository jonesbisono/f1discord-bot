[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-watchparty-bot"
version = "0.1.0"
description = "Multi-server Discord companion bot for Formula 1 watch parties"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "discord.py>=2.4.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
]

[project.scripts]
f1-bot = "f1_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = true
